name: build-libnode-android

on:
  workflow_dispatch:
    inputs:
      version:
        description: Node.js release tag to build (e.g. v26.8.1)
        required: true
        default: v26.8.1
      api_level:
        description: Android API level target
        required: true
        default: '24'
      arch:
        description: Target architecture (arm64, arm, x86_64, x86)
        required: true
        default: arm64

env:
  CCACHE_DIR: ${{ github.workspace }}/ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip xz-utils python3 make gcc g++ patch tar git ccache

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-node-${{ inputs.version }}-${{ inputs.arch }}
          restore-keys: |
            ccache-node-
          fail-on-cache-miss: false

      - name: Config ccache
        run: |
          ccache --set-config=max_size=4G
          ccache --set-config=compiler_check=content
          mkdir -p "$CCACHE_DIR"

      - name: Cache NDK zip
        uses: actions/cache@v4
        with:
          path: ndk.zip
          key: ndk-zip-ndk-r29-linux

      - name: Download Android NDK
        run: |
          if [ ! -f ndk.zip ]; then
            curl -sSfL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          fi
          unzip -q ndk.zip
          rm -f ndk.zip
          ls -d android-ndk-*

      - name: Fetch Node.js source
        run: |
          git clone --depth 1 --branch ${{ inputs.version }} https://github.com/nodejs/node.git node-src

      - name: Patch zlib.gyp for NDK cpufeatures
        run: |
          cp "$GITHUB_WORKSPACE/android-ndk-r29/sources/android/cpufeatures/cpu-features.c" \
             node-src/deps/zlib/cpu-features-ndk.c
          cd node-src
          python3 - <<'EOF'
          p = 'deps/zlib/zlib.gyp'
          s = open(p).read()
          probe = '            [\'OS=="mac" or OS=="ios" or OS=="freebsd" or OS=="android"\', {'
          ins = '            [\'OS=="android"\', {\n' + \
                '              \'sources\': [\n' + \
                '                \'<(ZLIB_ROOT)/cpu-features-ndk.c\'\n' + \
                '              ],\n' + \
                '            }],\n'
          assert probe in s, 'probe not found in zlib.gyp'
          assert 'cpu-features-ndk' not in s, 'already patched'
          s = s.replace(probe, ins + probe, 1)
          open(p, 'w').write(s)
          print('patched zlib.gyp')
          EOF

      - name: Configure for Android
        working-directory: node-src
        env:
          API_LEVEL: ${{ inputs.api_level }}
          ARCH: ${{ inputs.arch }}
        run: |
          set -e
          NDK="$GITHUB_WORKSPACE/android-ndk-r29"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          case "$ARCH" in
            arm64|aarch64) DEST_CPU=arm64; PREFIX=aarch64-linux-android; RUST_TARGET=aarch64-linux-android ;;
            arm)          DEST_CPU=arm;   PREFIX=armv7a-linux-androideabi; RUST_TARGET=armv7-linux-androideabi ;;
            x86_64)       DEST_CPU=x64;   PREFIX=x86_64-linux-android; RUST_TARGET=x86_64-linux-android ;;
            x86)          DEST_CPU=ia32;  PREFIX=i686-linux-android; RUST_TARGET=i686-linux-android ;;
          esac

          # Target compiler: NDK clang wrappers (bionic/libc++), via ccache
          export CC="ccache $TOOLCHAIN/bin/${PREFIX}${API_LEVEL}-clang"
          export CXX="ccache $TOOLCHAIN/bin/${PREFIX}${API_LEVEL}-clang++"

          # Host compiler for obj.host tools: Chromium's clang (as in deps/v8/DEPS),
          # same approach Termux uses (Ubuntu GCC is too old for V8), via ccache
          CLANG_TAR=$(grep -oE 'Linux_x64/clang-llvmorg-[0-9]+-init-[0-9]+-g[0-9a-f]+-[0-9]+\.tar\.xz' deps/v8/DEPS | head -1 | sed 's#Linux_x64/##')
          if [ -z "$CLANG_TAR" ]; then
            grep -oE 'Linux_x64/clang-[\\._0-9a-z-]+\\.tar\\.xz' deps/v8/DEPS | head -1 | sed 's#Linux_x64/##'
            echo "Could not find clang tarball in deps/v8/DEPS" >&2
            exit 1
          fi
          echo "V8 host clang from DEPS: $CLANG_TAR"
          mkdir -p "$GITHUB_WORKSPACE/llvm-build"
          curl -sSfL -o clang.tar.xz "https://commondatastorage.googleapis.com/chromium-browser-clang/Linux_x64/${CLANG_TAR}"
          tar -xJf clang.tar.xz -C "$GITHUB_WORKSPACE/llvm-build"
          export LLVM="$GITHUB_WORKSPACE/llvm-build"
          export CC_host="ccache $LLVM/bin/clang"
          export CXX_host="ccache $LLVM/bin/clang++"
          export LINK_host="$LLVM/bin/clang++"

          set +e
          echo "=== target CXX version ==="
          "$CXX" --version | head -1
          printf '#include <atomic>\nint main(){ std::atomic_ref<int> r(*new int(5)); return r.load() - 5; }\n' > /tmp/at.cpp
          "$CXX" -std=gnu++20 -fsyntax-only /tmp/at.cpp && echo ATOMIC_REF_OK || echo ATOMIC_REF_MISSING
          echo "=== host CXX version ==="
          "$CXX_host" --version | head -1
          printf '#include <atomic>\nint main(){ std::atomic_ref<int> r(*new int(5)); return r.load() - 5; }\n' > /tmp/at_host.cpp
          "$CXX_host" -std=gnu++20 -fsyntax-only /tmp/at_host.cpp && echo HOST_ATOMIC_REF_OK || echo HOST_ATOMIC_REF_MISSING
          set -e

          # Apply upstream Android patches (v8 trap-handler fix)
          ./android-configure patch

          # crates.gyp drops --release whenever cargo_rust_target is set,
          # building debug crates while expecting a release archive. Keep it.
          sed -i "s/cargo_build_flags': \['--target'/cargo_build_flags': ['--release', '--target'/" deps/crates/crates.gyp

          export GYP_DEFINES="target_arch=$ARCH v8_target_arch=$ARCH android_target_arch=$ARCH host_os=linux OS=android android_ndk_path=$NDK cargo_rust_target=$RUST_TARGET"
          export ANDROID_NDK_ROOT="$NDK"

          ./configure \
            --dest-cpu="$DEST_CPU" \
            --dest-os=android \
            --openssl-no-asm \
            --cross-compiling \
            --shared

      - name: Build
        working-directory: node-src
        run: |
          set -e
          # gyp makefiles emit 'LDFLAGS.host ?= $(LDFLAGS_host)', so the env
          # var LDFLAGS_host feeds directly into host (mksnapshot) link flags.
          # mksnapshot needs libatomic for 16-byte C++ atomics on x86_64.
          export LDFLAGS_host="-latomic"
          ARCH="${{ inputs.arch }}"
          API="${{ inputs.api_level }}"
          NDK="$GITHUB_WORKSPACE/android-ndk-r29"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          case "$ARCH" in
            arm64|aarch64) RUST_TARGET=aarch64-linux-android;        PREFIX=aarch64-linux-android ;;
            arm)          RUST_TARGET=armv7-linux-androideabi;       PREFIX=armv7a-linux-androideabi ;;
            x86_64)       RUST_TARGET=x86_64-linux-android;          PREFIX=x86_64-linux-android ;;
            x86)          RUST_TARGET=i686-linux-android;            PREFIX=i686-linux-android ;;
          esac
          # Node builds Rust crates (temporal) for the host by default when
          # cross-compiling, producing x86_64 objects that fail the aarch64
          # libnode.so link. Install the cross std and build them for the
          # Android target (cargo rustc only emits a static archive, so no
          # target linker is required; cc-crate shims need the NDK C compiler).
          command -v rustup >/dev/null 2>&1 && rustup target add "$RUST_TARGET" || echo "warn: rustup not available"
          export CC="$TOOLCHAIN/bin/${PREFIX}${API}-clang"
          export CXX="$TOOLCHAIN/bin/${PREFIX}${API}-clang++"
          export AR="$TOOLCHAIN/bin/llvm-ar"
          echo "Pre-building node crates for $RUST_TARGET"
          (cd deps/crates && cargo rustc --release --target "$RUST_TARGET" --frozen \
             --target-dir "$GITHUB_WORKSPACE/node-src/out/Release/obj/gen")
          make -j$(nproc)

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-node-${{ inputs.version }}-${{ inputs.arch }}

      - name: Upload libnode artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnode-android-${{ inputs.arch }}-${{ inputs.version }}
          path: |
            node-src/out/Release/libnode.so
            node-src/out/Release/libnode.so.*
            node-src/out/Release/node
          retention-days: 7

  build-webgpu-android:
    name: Build webgpu (dawn.node) android ${{ inputs.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip ninja-build cmake git python3 pkg-config ccache

      # The standard runner only has ~14GB; dawn deps + NDK + ccache get
      # close. Reclaim the worst preloaded bloat that we never use.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /var/lib/apt/lists/*
          sudo apt-get clean
          rm -rf ~/.cache/pip ~/.npm /tmp/ms-playwright 2>/dev/null || true
          df -h / | tail -1

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-webgpu-${{ inputs.arch }}
          restore-keys: |
            ccache-webgpu-
          fail-on-cache-miss: false

      - name: Config ccache
        run: |
          # Smaller cap than the node job: the webgpu ccache dir lives on the
          # same runner disk as the checkout.
          ccache --set-config=max_size=2G
          ccache --set-config=compiler_check=content
          mkdir -p "$CCACHE_DIR"

      - name: Cache NDK zip
        uses: actions/cache@v4
        with:
          path: ndk.zip
          key: ndk-zip-ndk-r29-linux

      - name: Download Android NDK
        run: |
          if [ ! -f ndk.zip ]; then
            curl -sSfL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          fi
          unzip -q ndk.zip
          rm -f ndk.zip

      - name: Checkout node-webgpu
        run: |
          git clone https://github.com/dawn-gpu/node-webgpu.git repo
          cd repo
          git submodule update --init --depth 1
          find third_party -name .git -type d -exec rm -rf {} + 2>/dev/null || true
          echo "submodule .git dirs cleaned"

      # Dawn DEPS for the Android cross build only. The upstream host
      # bootstrap (npm ci + node build/build.js) compiles dawn.node for the
      # host runner, which we do not ship and which explodes the 14GB runner
      # disk (full-history SwiftShader/ANGLE clones + the host ninja build).
      # We fetch the same git deps gclient would, shallow, with the image
      # android SDK turned off (we use our own NDK) and no node download
      # (setup-node already provides node).
      - name: Fetch dawn DEPS (cross-compile)
        working-directory: repo
        run: |
          export PATH="$PWD/third_party/depot_tools:$PATH"
          export DEPOT_TOOLS_UPDATE=0
          cd third_party/dawn
          cat > .gclient <<'EOF'
          solutions = [
              {
                  "name": ".",
                  "url": "https://dawn.googlesource.com/dawn",
                  "deps_file": "DEPS",
                  "managed": False,
                  "custom_vars": {
                      "dawn_node": True,
                      "checkout_android": False,
                  }
              }
          ]
          EOF
          gclient metrics --opt-out || true
          gclient sync --no-history
          df -h / | tail -1

      - name: Disk check before cross-compile
        run: df -h / && echo '--- repo ---' && du -sh repo 2>/dev/null && du -sh repo/third_party 2>/dev/null

      - name: Cross-compile dawn.node for Android
        env:
          NDK: ${{ github.workspace }}/android-ndk-r29
        run: |
          cd repo
          cmake -S third_party/dawn -B out/cmake-android -GNinja \
            -DDAWN_BUILD_NODE_BINDINGS=1 \
            -DDAWN_USE_X11=OFF \
            -DDAWN_USE_WAYLAND=OFF \
            -DDAWN_SUPPORTS_CXX_MODULES=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_VISIBILITY_PRESET=hidden \
            -DCMAKE_VISIBILITY_INLINES_HIDDEN=1 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_STL=c++_static
          ninja -C out/cmake-android dawn.node
          mkdir -p dist/linux-arm64
          cp out/cmake-android/dawn.node dist/linux-arm64/dawn.node
          file dist/linux-arm64/dawn.node

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/ccache
          key: ccache-webgpu-${{ inputs.arch }}

      - name: Upload webgpu artifact
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-android-${{ inputs.arch }}-${{ inputs.version }}
          path: repo/dist/linux-arm64/dawn.node
          retention-days: 7
