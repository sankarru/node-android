name: build-libnode-android

on:
  workflow_dispatch:
    inputs:
      version:
        description: Node.js release tag to build (e.g. v26.8.1)
        required: true
        default: v26.8.1
      api_level:
        description: Android API level target
        required: true
        default: '24'
      arch:
        description: Target architecture (arm64, arm, x86_64, x86)
        required: true
        default: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl unzip python3 make gcc g++ patch tar

      - name: Download Android NDK
        run: |
          curl -sSfL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q ndk.zip
          ls -d android-ndk-*

      - name: Fetch Node.js source
        run: |
          git clone --depth 1 --branch ${{ inputs.version }} https://github.com/nodejs/node.git node-src

      - name: Configure for Android
        working-directory: node-src
        env:
          API_LEVEL: ${{ inputs.api_level }}
          ARCH: ${{ inputs.arch }}
        run: |
          NDK="$GITHUB_WORKSPACE/android-ndk-r27c"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          case "$ARCH" in
            arm64|aarch64) DEST_CPU=arm64; PREFIX=aarch64-linux-android ;;
            arm)          DEST_CPU=arm;   PREFIX=armv7a-linux-androideabi ;;
            x86_64)       DEST_CPU=x64;   PREFIX=x86_64-linux-android ;;
            x86)          DEST_CPU=ia32;  PREFIX=i686-linux-android ;;
          esac

          export PATH="$TOOLCHAIN/bin:$PATH"
          export CC="$TOOLCHAIN/bin/${PREFIX}${API_LEVEL}-clang"
          export CXX="$TOOLCHAIN/bin/${PREFIX}${API_LEVEL}-clang++"

          echo "=== compiler version ==="
          "$CXX" --version | head -2
          echo "=== include resolution ==="
          printf '#include <atomic>\nint main(){ std::atomic_ref<int> r(*new int(5)); return r.load() - 5; }\n' > /tmp/at.cpp
          "$CXX" -std=gnu++20 -E -v -x c++ /tmp/at.cpp 2>&1 | grep -E "clang version|Selected GCC|^ /|search starts|^ *#include <...> search" | head -30
          echo "=== atomic_ref compile test ==="
          "$CXX" -std=gnu++20 -fsyntax-only /tmp/at.cpp && echo "ATOMIC_REF_OK" || echo "ATOMIC_REF_MISSING"
          echo "=== gcc default ==="
          g++ --version | head -1

          # Apply upstream Android patches (v8 trap-handler fix)
          ./android-configure patch

          export GYP_DEFINES="target_arch=$ARCH v8_target_arch=$ARCH android_target_arch=$ARCH host_os=linux OS=android android_ndk_path=$NDK"

          ./configure \
            --dest-cpu="$DEST_CPU" \
            --dest-os=android \
            --openssl-no-asm \
            --cross-compiling \
            --shared

      - name: Build
        working-directory: node-src
        run: make -j$(nproc)

      - name: Upload libnode artifact
        uses: actions/upload-artifact@v4
        with:
          name: libnode-android-${{ inputs.arch }}-${{ inputs.version }}
          path: |
            node-src/out/Release/libnode.so
            node-src/out/Release/libnode.so.*
            node-src/out/Release/node
          retention-days: 7